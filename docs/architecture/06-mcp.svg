<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 690" role="img" aria-label="How an MCP tool is reached. At startup the harness starts the server as a separate process, asks it for its tools with tools/list, and registers a wrapper function and a definition for each. On a tool call, the model asks for count_letters, the wrapper sends a tools/call request down the server's stdin, the server runs its own code and replies on stdout, and the text comes back to the model as a tool_result.">
<style>
svg { --panel: #ffffff; --tint: #e3f0ef; --fg: #15212b; --muted: #566572; --line: #9aa8b3; --accent: #0b6b6b; --ext: #9a5a0a;
--sans: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
@media (prefers-color-scheme: dark) { svg { --panel: #172028; --tint: #14302f; --fg: #e3e9ed; --muted: #9babb6; --line: #5b6a75; --accent: #55c4c0; --ext: #e2a658; } }
svg .bgr { fill: var(--panel); }
/* diagram marks */
svg text { fill: var(--fg); font-family: var(--sans); font-size: 12px; }
svg .h { font-weight: 600; font-size: 13px; }
svg .c { font-family: var(--mono); font-size: 11.5px; }
svg .ch { font-family: var(--mono); font-size: 13px; font-weight: 500; }
svg .m { fill: var(--muted); font-size: 11.5px; }
svg .lab { font-size: 11.5px; paint-order: stroke; stroke: var(--panel); stroke-width: 4px; stroke-linejoin: round; }
svg .cap { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; fill: var(--accent); }
svg .cap-m { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; fill: var(--muted); paint-order: stroke; stroke: var(--panel); stroke-width: 4px; stroke-linejoin: round; }
svg .box { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
svg .harness { fill: var(--tint); stroke: var(--accent); stroke-width: 1.5; }
svg .ext { fill: var(--panel); stroke: var(--ext); stroke-width: 1.6; }
svg .plan { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 6 4; }
svg .arrow { fill: none; stroke: var(--fg); stroke-width: 1.3; }
svg .arrow-p { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
svg .head { fill: var(--fg); }
svg .head-p { fill: var(--muted); }
svg .life { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 4; }
svg .pill { fill: var(--tint); stroke: var(--accent); stroke-width: 1; }
svg .stn { fill: var(--accent); }
svg .stn-t { fill: var(--panel); font-family: var(--mono); font-size: 12px; font-weight: 500; }
svg .seg { fill: var(--accent); }
svg .wait { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 6 4; }
svg .brace { fill: none; stroke: var(--muted); stroke-width: 1.2; }
</style>
<rect width="100%" height="100%" class="bgr"/>
<defs><marker id="d1" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" class="head"/></marker></defs>
<path d="M 315 34 V 28 H 775 V 34" class="brace"/><text x="545" y="20" text-anchor="middle" class="cap">HARNESS PROCESS</text>
<rect x="25" y="40" width="170" height="44" rx="5" class="ext"/>
<text x="110" y="67" text-anchor="middle" class="h">Model API</text>
<line x1="110" y1="84" x2="110" y2="670" class="life"/>
<rect x="315" y="40" width="170" height="44" rx="5" class="harness"/>
<text x="400" y="60" text-anchor="middle" class="ch">run_agent</text><text x="400" y="76" text-anchor="middle" class="m">loop + execute_tool</text>
<line x1="400" y1="84" x2="400" y2="670" class="life"/>
<rect x="605" y="40" width="170" height="44" rx="5" class="harness"/>
<text x="690" y="60" text-anchor="middle" class="ch">mcp_client.py</text><text x="690" y="76" text-anchor="middle" class="m">wrapper + pipe handling</text>
<line x1="690" y1="84" x2="690" y2="670" class="life"/>
<rect x="925" y="40" width="170" height="44" rx="5" class="ext"/>
<text x="1010" y="60" text-anchor="middle" class="h">MCP server</text><text x="1010" y="76" text-anchor="middle" class="m">a separate process</text>
<line x1="1010" y1="84" x2="1010" y2="670" class="life"/>
<text x="20" y="112" class="cap-m">AT STARTUP, ONCE</text>
<line x1="690" y1="142" x2="1008" y2="142" class="arrow" marker-end="url(#d1)"/>
<text x="704" y="134" class="lab">starts the process; holds its stdin and stdout</text>
<line x1="690" y1="186" x2="1008" y2="186" class="arrow" marker-end="url(#d1)"/>
<text x="704" y="178" class="lab c">tools/list</text>
<line x1="1010" y1="230" x2="692" y2="230" class="arrow" marker-end="url(#d1)"/>
<text x="704" y="222" class="lab">name, description, inputSchema per tool</text>
<line x1="690" y1="274" x2="402" y2="274" class="arrow" marker-end="url(#d1)"/>
<text x="414" y="266" class="lab">adds a wrapper to FUNCTIONS</text>
<text x="414" y="292" class="m">and the definition to the tools list</text>
<line x1="20" y1="318" x2="1160" y2="318" class="life"/>
<text x="20" y="342" class="cap-m">ON A TOOL CALL</text>
<line x1="400" y1="372" x2="112" y2="372" class="arrow" marker-end="url(#d1)"/>
<text x="124" y="364" class="lab">request: tools include count_letters</text>
<line x1="110" y1="416" x2="398" y2="416" class="arrow" marker-end="url(#d1)"/>
<text x="124" y="408" class="lab">tool_use count_letters · id toolu_A</text>
<line x1="400" y1="460" x2="688" y2="460" class="arrow" marker-end="url(#d1)"/>
<text x="414" y="452" class="lab">hooks pass, then the wrapper is called</text>
<line x1="690" y1="504" x2="1008" y2="504" class="arrow" marker-end="url(#d1)"/>
<text x="704" y="496" class="lab c">tools/call + arguments · id 7</text>
<rect x="1002" y="514" width="16" height="36" rx="3" class="pill"/><text x="1026" y="536" class="m">its own code runs</text>
<line x1="1010" y1="560" x2="692" y2="560" class="arrow" marker-end="url(#d1)"/>
<text x="704" y="552" class="lab c">content &quot;3&quot;, isError false · id 7</text>
<line x1="690" y1="604" x2="402" y2="604" class="arrow" marker-end="url(#d1)"/>
<text x="414" y="596" class="lab">the text, or an error if isError</text>
<line x1="400" y1="648" x2="112" y2="648" class="arrow" marker-end="url(#d1)"/>
<text x="124" y="640" class="lab">tool_result for toolu_A, in the next request</text>
</svg>
